services:
  - type: web
    name: xorazm-shevalari-backend-api
    runtime: docker
    healthCheckPath: /health
    # DIQQAT: bu blok faqat DOIMIY DISKLI (pullik) tarifda ishlaydi.
    # Xizmat hozir bepul tarifda: u spin-down bo'ladi va doimiy disk
    # olmaydi. Shuning uchun hech qanday kod diskning saqlanishiga
    # tayanmaydi — audio ham, reliz APK'lari ham PostgreSQL da turadi.
    disk:
      name: xorazm-audio
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: AUDIO_STORAGE_MODE
        value: local
      - key: AUDIO_UPLOAD_DIR
        value: /var/data/uploads
      - key: PORT
        value: "3000"
      - key: PUBLIC_BASE_URL
        value: https://xorazm-shevalari-backend-api.onrender.com
      - key: TRUST_PROXY
        value: "true"
      # APK yuklab olish havolasi Cloudflare Worker orqali beriladi.
      #
      # NEGA: ilova API uchun ham shu Worker'dan foydalanadi, chunki
      # O'zbekistondan Render hostiga to'g'ridan-to'g'ri yo'l sekin.
      # Havola Render hostiga ishora qilganda ilova yangilanishni
      # topardi-yu, 37 MB lik faylni ola olmasdi. Worker esa faylni
      # chekka keshdan beradi — tez va bepul tarifdagi origin'ni
      # yuklamaydi.
      #
      # Bu qiymat FAQAT havola qurish uchun; fayl baribir shu
      # xizmatning `/v3/app-updates/download/...` yo'lidan chiqadi.
      - key: PUBLIC_DOWNLOAD_BASE_URL
        value: https://xorazm-api.ortiqov619.workers.dev
      # Reliz APK'lari 0018 migratsiyasidan boshlab PostgreSQL da
      # saqlanadi (`app_release_artifacts`). Sabab: bepul tarifda
      # doimiy disk yo'q va konteyner fayl tizimi har redeployda
      # tozalanadi — reliz yozuvi qolib, fayl yo'qolardi va ilova
      # foydalanuvchiga ishlamaydigan yangilanish ko'rsatardi.
      #
      # `APK_UPLOAD_DIR` endi faqat migratsiyadan OLDIN diskka yozilgan
      # eski fayllarni o'qish uchun. Uni sozlash shart emas.
      #
      # Obyekt xotirasiga (R2/S3) o'tilganda faqat
      # `src/release-storage.ts` almashtiriladi.
      #
      # CI reliz nashr qilish tokeni — Render panelidan kiritiladi.
      - key: RELEASE_TOKEN
        sync: false
      # FCM service account (base64). Bo'sh bo'lsa push o'chirilgan bo'ladi,
      # yangilanish tizimi esa versiya so'rovi orqali baribir ishlaydi.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
