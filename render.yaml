services:
  - type: web
    name: xorazm-shevalari-backend-api
    runtime: docker
    healthCheckPath: /health
    disk:
      name: xorazm-audio
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: AUDIO_STORAGE_MODE
        value: local
      - key: AUDIO_UPLOAD_DIR
        value: /var/data/uploads
      - key: PORT
        value: "3000"
      - key: PUBLIC_BASE_URL
        value: https://xorazm-shevalari-backend-api.onrender.com
      - key: TRUST_PROXY
        value: "true"
      # DIQQAT: bepul tarifda doimiy disk YO'Q. Shuning uchun reliz
      # APK'lari backend diskida saqlanmaydi — ular ochiq
      # `xorazm-shevalari-releases` repozitoriyasining Releases bo'limida
      # turadi va backend faqat havola bilan checksumni saqlaydi.
      #
      # `APK_UPLOAD_DIR` faqat backendning o'zi APK qabul qiladigan
      # (multipart) yo'l uchun kerak. Doimiy disk paydo bo'lgandagina
      # ma'noga ega bo'ladi.
      #
      # CI reliz nashr qilish tokeni — Render panelidan kiritiladi.
      - key: RELEASE_TOKEN
        sync: false
      # FCM service account (base64). Bo'sh bo'lsa push o'chirilgan bo'ladi,
      # yangilanish tizimi esa versiya so'rovi orqali baribir ishlaydi.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
