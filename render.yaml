services:
  - type: web
    name: xorazm-shevalari-backend-api
    runtime: docker
    healthCheckPath: /health
    disk:
      name: xorazm-audio
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: AUDIO_STORAGE_MODE
        value: local
      - key: AUDIO_UPLOAD_DIR
        value: /var/data/uploads
      - key: PORT
        value: "3000"
      - key: PUBLIC_BASE_URL
        value: https://xorazm-shevalari-backend-api.onrender.com
      - key: TRUST_PROXY
        value: "true"
      # Reliz APK'lari audio bilan bir xil doimiy diskda turadi.
      - key: APK_UPLOAD_DIR
        value: /var/data/apk
      # Har bir ilova turi uchun diskda saqlanadigan reliz soni.
      - key: APK_RETENTION
        value: "5"
      # Yuklab olish Cloudflare orqali ketadi: Render'ga to'g'ridan-to'g'ri
      # ulanish O'zbekistondan juda sekin.
      - key: PUBLIC_DOWNLOAD_BASE_URL
        value: https://xorazm-api.ortiqov619.workers.dev
      # CI reliz nashr qilish tokeni — Render panelidan kiritiladi.
      - key: RELEASE_TOKEN
        sync: false
      # FCM service account (base64). Bo'sh bo'lsa push o'chirilgan bo'ladi,
      # yangilanish tizimi esa versiya so'rovi orqali baribir ishlaydi.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
